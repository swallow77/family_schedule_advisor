# Replace entity IDs with the IDs generated by your integration.
type: vertical-stack
cards:
  - type: entities
    title: 가족 일정 출발 도우미
    entities:
      - sensor.family_schedule_advisor_status
      - sensor.family_schedule_advisor_today_schedule
      - sensor.family_schedule_advisor_schedule_conflicts
      - sensor.family_schedule_advisor_next_event
      - sensor.family_schedule_advisor_departure_timestamp
      - sensor.family_schedule_advisor_notify_timestamp
      - button.family_schedule_advisor_recalculate
      - button.family_schedule_advisor_mark_prepared
      - button.family_schedule_advisor_mark_departed
      - button.family_schedule_advisor_snooze
      - button.family_schedule_advisor_skip_event
  - type: markdown
    title: 오늘 일정
    content: >-
      {% set events = state_attr('sensor.family_schedule_advisor_today_schedule', 'events') or [] %}
      {% for event in events %}
      **{{ event.person_name }} · {{ event.event_title }}**

      약속: {{ event.event_time_text }}

      준비: {{ event.notify_time_text }} / 출발: {{ event.departure_time_text }}

      {{ event.status }}{% if event.route_link %} · [지도 열기]({{ event.route_link }}){% endif %}

      {% else %}
      오늘 예정된 일정이 없습니다.
      {% endfor %}
